@keyframes cojWaveTwo{0%{transform:translate3d(7%,-2px,0) rotate(4deg) scaleY(1.08)}50%{transform:translate3d(-1%,7px,0) rotate(-3deg) scaleY(.88)}100%{transform:translate3d(-7%,-5px,0) rotate(2deg) scaleY(1.14)}}

const $=id=>document.getElementById(id),canvas=$('wave'),cx=canvas.getContext('2d');let buffer=null,sourceUrl=null,trimUndo=[],start=0,end=0,drag=null,loop=false,recorder=null,chunks=[],wavePeaks=[],wavePhase=0,lastWaveFrame=0;const fmt=s=>{s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};const status=s=>$('status').textContent=s;$('newRingtone').onclick=()=>openPicker('audio/*,video/*');function openPicker(accept){const f=$('file');f.accept=accept;f.value='';f.click()};$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};const dropZone=$('wavebox');let dragDepth=0;const hasDraggedFiles=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');dropZone.addEventListener('dragenter',e=>{if(!hasDraggedFiles(e))return;e.preventDefault();dragDepth++;dropZone.classList.add('file-drag')});dropZone.addEventListener('dragover',e=>{if(!hasDraggedFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';dropZone.classList.add('file-drag')});dropZone.addEventListener('dragleave',e=>{if(!hasDraggedFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dropZone.classList.remove('file-drag')});dropZone.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;dropZone.classList.remove('file-drag');const f=Array.from(e.dataTransfer?.files||[]).find(f=>f.type.startsWith('audio/')||f.type.startsWith('video/')||/\.(mp3|m4a|wav|aac|ogg|flac|mp4|mov|webm)$/i.test(f.name));if(f)loadFile(f);else status('Sleep een audio- of videobestand naar dit vak.')});async function loadFile(f){try{stopSeamlessLoop();status('Bestand verwerken…');const ab=await f.arrayBuffer(),ac=new (window.AudioContext||window.webkitAudioContext)();try{buffer=await ac.decodeAudioData(ab)}finally{await ac.close()}for(const step of trimUndo)if(step.sourceUrl&&step.sourceUrl!==sourceUrl)URL.revokeObjectURL(step.sourceUrl);trimUndo=[];$('undoTrim').disabled=true;if(sourceUrl)URL.revokeObjectURL(sourceUrl);sou
