name: One-time audit cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-cleanup-once.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited text cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          repl = {
            "status('Playing from cue '+fmt(cuePoint));": "status('');",
            "status('Play niet toegestaan')": "status('Playback is not allowed')",
            "status('Trim mislukt: '+e.message)": "status('Trim failed: '+e.message)",
            "status('Trim ongedaan gemaakt. Origineel en selectie hersteld.')": "status('Trim undone. Original audio and selection restored.')",
            "status('Tik op Play om verder te luisteren.')": "status('Tap Play to continue listening.')",
            "throw Error('Opname niet ondersteund')": "throw Error('Audio recording is not supported')",
            "Make sure the file is downloaded locally and not beveiligd is.": "Make sure the file is downloaded locally and is not protected.",
            "msg.textContent='Preview wordt afgespeeld…'": "msg.textContent='Preview is playing…'",
            "msg.textContent='Preview voltooid.'": "msg.textContent='Preview finished.'",
            "msg.textContent='Preview gestopt.'": "msg.textContent='Preview stopped.'",
          }
          missing=[]
          for old,new in repl.items():
              if old not in s:
                  missing.append(old)
              s=s.replace(old,new)
          if missing:
              raise SystemExit('Expected audit targets missing: '+repr(missing))
          p.write_text(s)
          PY
      - name: Regression check 1 - JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/audit.js').write_text('\n'.join(scripts))
          print('inline script blocks:',len(scripts))
          PY
          node --check /tmp/audit.js
      - name: Regression check 2 - critical UI and audio features remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['id="chooseFile"','id="record"','id="showProjects"','id="openVoiceStudio"','id="wave"','id="cue"','id="play"','id="trim"','id="undoTrim"','id="saveProject"','id="shareRingtone"','startSeamlessLoop','startScratch','indexedDB.open','serviceWorker.register']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Critical regression: '+repr(missing))
          assert 'id="openAppleMusic"' not in s
          print('critical feature markers OK:',len(required))
          PY
      - name: Regression check 3 - requested text cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          forbidden=['Playing from cue','Play niet toegestaan','Trim mislukt','Trim ongedaan gemaakt','Origineel en selectie hersteld','Tik op Play','Opname niet ondersteund','beveiligd is','Preview wordt afgespeeld','Preview voltooid','Preview gestopt']
          hits=[x for x in forbidden if x in s]
          if hits: raise SystemExit('Cleanup regression: '+repr(hits))
          print('all audited text targets removed/translated')
          PY
      - name: Commit audited cleanup and remove one-time workflow
        run: |
          rm .github/workflows/audit-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/audit-cleanup-once.yml
          git commit -m 'Polish status text after full audit'
          git push origin HEAD:main
